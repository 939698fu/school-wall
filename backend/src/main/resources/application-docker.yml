# Docker / docker-compose 环境配置（通过环境变量注入敏感信息）
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:school_wall}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:schoolwall}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

# 微信配置优先读容器环境变量 WECHAT_APP_ID / WECHAT_APP_SECRET（见 WechatMiniappProperties）
wechat:
  miniapp:
    app-id: wxec7999d3f2fb4a98
    app-secret: 6273a186f73b50861b07cfe418154f7c

jwt:
  secret: ${JWT_SECRET:school-wall-docker-change-me-in-production}

file:
  upload:
    path: /app/uploads
    access-url: /api/upload

logging:
  level:
    root: INFO
    com.example.schoolwall: DEBUG
    com.example.schoolwall.mapper: DEBUG
    com.baomidou.mybatisplus: WARN

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
